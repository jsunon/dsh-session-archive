# ============================================================================
# dsh-session-archive —— 会话归档（每条会话一个独立文件夹）
# ============================================================================
# 只有一个 loader 条目：宿主半区（package.json 的 main / exports["."]）在宿主
# 进程里监听 session/created 与 session/event，把每条会话写成：
#   <工作区>/会话归档/【类目-摘要】/聊天记录.md
#   <工作区>/会话归档/【类目-摘要】/源码文件/
#   <工作区>/会话归档/【类目-摘要】/其他产出文件/
# 没有浏览器半区，所以不需要 dsh.client。
# 设置面板：http://127.0.0.1:<web端口>/dsh-session-archive
# ============================================================================

- insert:
    - id: dsh-session-archive
      name: 'dsh-session-archive'
      config:
        # 总开关；关闭后不再新建/更新会话文件夹。
        enabled: true
        # 唯一主入口文件夹名（规格要求所有会话都收在它下面）。
        # 留空 = 会话文件夹直接放在工作区根目录（不再多一层「会话归档」）
        containerName: ''
        # 命名模板。支持占位符 {kind} 类目、{summary} 摘要、{date} 日期、{time} 时间。
        nameTemplate: '【{kind}-{summary}】'
        # 名称长度限制（字符数），规格要求 15~30。
        minChars: 15
        maxChars: 30
        # 是否自动把代码块提取成 源码文件/ 下的独立文件；关闭则代码留在聊天日志里。
        extractCode: true
        # 是否把非代码的长文本块（md/txt）也单独存进 其他产出文件/。
        extractLongText: false
        # 黑名单关键词：命中则不新建会话文件夹（标题或首条消息包含即命中）。
        blacklist: []
        # 是否也给子代理（subagent）会话建文件夹。
        includeSubagents: false
        # 会话创建后等待多久落盘（毫秒）：给标题/首条消息留出生成时间。
        settleMs: 1500
        # 兜底扫描间隔（毫秒）：补写漏掉的更新、处理标题晚到后的改名。
        tickMs: 20000
        # 同一会话重排程的最小间隔（毫秒）。
        refreshMs: 60000
        # 自动压缩：聊天记录超过 N 条后，把旧内容转入 聊天记录-历史-<时间>.md；0=关闭。
        compressAfter: 0
        # 自动清理：历史文件保留天数，超期删除；0=永久保留。
        cleanupHistoryDays: 0
        # 是否写 session.json（会话元数据：ID、目录、条数、时间）。
        writeSessionJson: true
        # 是否把散落在「会话文件夹根目录 / 工作区根目录」的文件按扩展名分流到
        # 源码文件/ 与 其他产出文件/。默认关闭：工作区根目录是你自己的地盘，
        # 只有明确开启后才会搬动那边的文件（会话文件夹根目录始终会自动归位）。
        divertWorkspaceFiles: false
        # 工作区根目录里的其它文件夹/文件，收进唯一的会话文件夹（只有一个会话时才动手；
        # 宿主 node_modules 以 junction 引用的插件目录永远不搬，避免把插件搬断）
        absorbWorkspaceRoot: true
        # 三个固定产物名（一般不用改）。
        # 会话文件夹内部不再细分：代码与产出文件平铺在会话文件夹里（留空 = 不建子目录）
        dirs:
          chat: '聊天记录.md'
          code: ''
          other: ''
