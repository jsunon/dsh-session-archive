name: Move i18n READMEs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move translations into docs/readme
        run: |
          set -euo pipefail
          mkdir -p docs/readme
          for f in README_*.md; do git mv "$f" "docs/readme/$f"; done
          sed -i 's#](./README_#](./docs/readme/README_#g' README.md
          sed -i 's#](./README.md)#](../README.md)#g' docs/readme/*.md
          sed -i 's#](docs/#](../#g' docs/readme/*.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: move translations into docs/readme"
          git push
      - name: Remove this workflow
        run: |
          git rm -q .github/workflows/move-i18n.yml
          git commit -m "chore: drop one-off move workflow"
          git push
